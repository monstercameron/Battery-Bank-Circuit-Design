title: Battery Bank / Travel Router
description: Open-hardware USB-C battery bank, 2.5G Ethernet dock and OpenWrt travel router. Design in progress.
url: https://monstercameron.github.io
baseurl: /Battery-Bank-Circuit-Design
lang: en
author: monstercameron
image: /assets/og-card.png
twitter:
  card: summary_large_image
social:
  name: Battery Bank Travel Router
  links:
    - https://github.com/monstercameron/Battery-Bank-Circuit-Design
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-seo-tag
  - jekyll-sitemap
gh_edit_link: true
gh_edit_repository: https://github.com/monstercameron/Battery-Bank-Circuit-Design
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
aux_links:
  "View on GitHub":
    - https://github.com/monstercameron/Battery-Bank-Circuit-Design
search_enabled: true
heading_anchors: true
exclude:
  - datasheets/text/
  - datasheets/text
back_to_top: true
back_to_top_text: "Back to top"
mermaid:
  version: "10.9.0"

# These four pages and the datasheet index have no front matter (owned by other
# processes); jekyll-optional-front-matter renders them and the defaults below
# give them a layout and a title. They are reached from the Reference page.
defaults:
  - scope:
      path: "chip-metadata.md"
    values:
      layout: default
      title: "Chip metadata"
      nav_exclude: true
  - scope:
      path: "design-rules.md"
    values:
      layout: default
      title: "Design rules"
      nav_exclude: true
  - scope:
      path: "jlcpcb-rules.md"
    values:
      layout: default
      title: "JLCPCB rules"
      nav_exclude: true
  - scope:
      path: "power-budget.md"
    values:
      layout: default
      title: "Power budget"
      nav_exclude: true
  - scope:
      path: "datasheets/INDEX.md"
    values:
      layout: default
      title: "Datasheet index"
      nav_exclude: true
